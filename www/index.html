<style>
:root{--bg:#FFF4D6;--card:#fff;--tx:#111;--bd:#111;--dim:#555;--ac:#FFE500;--on:#111;--pk:#FF6B9D;--cy:#35D4FF;--lm:#B8FF3C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171C;--card:#25252C;--tx:#F4F0E6;--bd:#F4F0E6;--dim:#A9A59B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171C;--card:#25252C;--tx:#F4F0E6;--bd:#F4F0E6;--dim:#A9A59B;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:15px/1.5 system-ui,sans-serif;background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 16px 170px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.bx{background:var(--card);border:3px solid var(--bd);box-shadow:4px 4px 0 var(--bd)}
.btn,.chip,.ib,.fab,.tools button,.sm{border:3px solid var(--bd);box-shadow:3px 3px 0 var(--bd);background:var(--card);font-weight:700}
.btn:active,.chip:active,.ib:active,.fab:active,.tools button:active,.sm:active,.row:active,.card:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--bd)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.ttl{font:900 20px/1 system-ui;letter-spacing:1px;text-transform:uppercase;background:var(--ac);color:var(--on);border:3px solid var(--bd);box-shadow:4px 4px 0 var(--bd);padding:8px 14px;transform:rotate(-2deg)}
.ib{width:44px;height:44px;display:grid;place-items:center;font-size:20px}.logo{width:44px;height:44px;background:var(--pk);border:3px solid var(--bd);box-shadow:3px 3px 0 var(--bd);animation:sp 10s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hello{display:flex;gap:14px;align-items:center;margin-bottom:16px}.hello b{font:900 26px/1.1 system-ui;text-transform:uppercase}.dim{color:var(--dim);font-size:12px;font-family:ui-monospace,monospace}
.in,.si{width:100%;background:var(--card);border:3px solid var(--bd);box-shadow:4px 4px 0 var(--bd);color:var(--tx);padding:12px;font:inherit;outline:0}.in:focus{background:var(--ac);color:var(--on)}
.sg{padding:9px 12px;margin-top:8px;cursor:pointer;font-family:ui-monospace,monospace;font-size:13px;background:var(--lm);color:#111;border:3px solid var(--bd)}.sg small{display:block;opacity:.7}.msg{margin-top:12px;padding:10px;background:var(--cy);color:#111;border:3px solid var(--bd);font:600 12px ui-monospace,monospace;white-space:pre-line}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{padding:10px;text-align:center}.stat:nth-child(1){background:var(--ac);color:#111}.stat:nth-child(2){background:var(--pk);color:#111}.stat:nth-child(3){background:var(--cy);color:#111}.stat b{display:block;font:900 28px/1 system-ui}.stat .dim{color:#111}
h4{font:900 12px ui-monospace,monospace;letter-spacing:2px;margin:24px 0 10px;display:inline-block;background:var(--tx);color:var(--bg);padding:3px 8px}
.row{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:12px;cursor:pointer}.row .m{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .x{color:var(--dim);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{width:36px;height:36px;display:grid;place-items:center;flex:none}.hs{display:flex;gap:12px;overflow-x:auto;padding:2px 6px 12px 2px}.hs .bx{min-width:150px;padding:12px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 6px 12px 2px}.chip{white-space:nowrap;padding:7px 12px;font-size:13px}.chip.on{background:var(--ac);color:var(--on)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{cursor:pointer;overflow:hidden}.cv{height:96px;display:grid;place-items:center;font:900 40px system-ui;color:#111;border-bottom:3px solid var(--bd);background-size:cover;background-position:center}.card .p{padding:10px 12px}.card b{display:block;line-height:1.2}.card .x{color:var(--dim);font-size:12px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;border-top:3px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}.tabs button{flex:1;padding:9px 0;font:800 11px ui-monospace,monospace;text-transform:uppercase;display:grid;gap:1px;border-right:3px solid var(--bd)}.tabs button:last-child{border:0}.tabs i{font-style:normal;font-size:19px}.tabs .on{background:var(--ac);color:var(--on)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(82px + var(--kb,0px) + env(safe-area-inset-bottom,0px));width:60px;height:60px;background:var(--pk);color:#111;font-size:32px;z-index:8;box-shadow:5px 5px 0 var(--bd)}.fab.o{background:var(--ac)}
.ov{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.55)}.tools{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(152px + var(--kb,0px) + env(safe-area-inset-bottom,0px));z-index:8;display:grid;gap:10px;justify-items:end;max-height:62vh;overflow-y:auto;padding:0 6px 6px 0}.tools button{padding:10px 14px;display:flex;gap:10px;align-items:center;background:var(--lm);color:#111}.tools button:nth-child(3n+1){background:var(--ac)}.tools button:nth-child(3n+2){background:var(--cy)}

const BL=x=>['UL','OL','H1','H2','H3','TABLE','PRE','BLOCKQUOTE','HR','FIGURE'].includes(x.tagName)||x.classList.contains('cl')||x.classList.contains('co3');
const blk=c=>{const t=c.tagName,cl=c.classList;
if(/^H[1-6]$/.test(t)){X('#'.repeat(Math.min(3,+t[1]))+' '+inlM(c).trim());return}
if(t=='UL'||t=='OL'){[...c.children].forEach((li,j)=>X((t=='UL'?'- ':(j+1)+'. ')+inlM(li).trim()));return}
if(t=='BLOCKQUOTE'){lines(c).forEach(l=>l&&X('> '+l));return}
if(t=='HR'){X('---');return}
if(t=='PRE'){X('```');X(c.textContent.replace(/\n$/,''));X('```');return}
if(t=='TABLE'){[...c.rows].forEach((r,j)=>{X('| '+[...r.cells].map(x=>inlM(x).trim().replace(/\|/g,'/')||' ').join(' | ')+' |');if(j==0)X('| '+[...r.cells].map(()=>'---').join(' | ')+' |')});return}

if(cl.contains('cl')){X('- ['+(cl.contains('d')?'x':' ')+'] '+inlM(c).trim());return}

P(inlM(c).trim())};
const walk=c=>{if(c.nodeType==3||(c.nodeType==1&&INL.includes(c.tagName)&&!c.classList.contains('cl'))){if(c.nodeType==1&&c.tagName=='BR'){flush();return}buf=(buf||'')+inl1(c);return}if(c.nodeType==1){flush();blk(c)}};

function colsView(live){const cols=[...new Set(live.map(n=>n.col).filter(Boolean))];return `<div class="sec"><b>Workspaces</b></div><div class="cg">${D.set.ws.map(w=>`<button class="bx cc" data-a="wsgo" data-v="${E(w)}">${ic('folder',22)}<b>${E(w)}</b><span>${live.filter(n=>n.fo==w).length} notes</span></button>`).join('')}</div><div class="sec"><b>Collections</b></div>${cols.length?`<div class="cg">${cols.map(c=>`<button class="bx cc" data-a="colgo" data-v="${E(c)}">${ic('tag',22)}<b>${E(c)}</b><span>${live.filter(n=>n.col==c).length} notes</span></button>`).join('')}</div>`:empty('tag','No collections yet','Group notes by typing a name in “Add to a collection” at the top of any note, for example Trips/2026.')}`}
function libPage(live){const act=[S.f!='all'?S.f:'',S.fo,S.col,S.tag].filter(Boolean);
let h=hdr('Library')+hint('lib','notes','Your library','Tap a note to open it, or the ⋮ button for pin, archive and move. Use the filter button in the search bar to sort and filter.')+`<div class="bx sbar">${ic('search',18)}<input id="sq" placeholder="Search notes…" value="${E(S.q)}" aria-label="Search notes"><button class="sm2" data-a="fs_open" title="Filter and sort" aria-label="Filter and sort">${ic('filter',20)}</button></div>${!S.q&&(D.set.rs||[]).length?`<div class="pills" style="padding-top:10px">${D.set.rs.map(x=>`<button class="chip" data-a="rs" data-v="${E(x)}">${ic('history',14)} ${E(x)}</button>`).join('')}</div>`:''}<div class="pills" style="margin-top:12px">${[['all','All'],['notes','Notes'],['art','Articles'],['cols','Collections']].map(([k,l])=>`<button class="chip ${(S.lt||'all')==k?'on':''}" data-a="lt" data-v="${k}">${l}</button>`).join('')}</div>${act.length?`<div class="pills" style="padding-top:0">${act.map(x=>`<span class="chip on" style="display:inline-flex;gap:6px;align-items:center">${E(x)}</span>`).join('')}<button class="chip" data-a="fclear">Clear</button></div>`:''}`;
if((S.lt||'all')=='cols')return h+colsView(live);
const L=list();h+=L.length?(S.vw=='grid'?`<div class="grid">${L.map(ncard).join('')}</div>`:`<div class="bx" style="padding:4px 14px">${L.map(nrow).join('')}</div>`):libEmpty();return h}
function artPage(arts){return hdr('Articles','Your notes as designed pages',`<button class="chip" data-a="tpl_gallery" title="Browse article designs" style="display:inline-flex;gap:6px;align-items:center">${ic('palette',16)} Designs</button>`)+hint('art','news','Articles','Notes you have turned into articles appear here. Open one and tap DESIGN to pick a template. Short notes become posters; long notes get a contents bar and stats.')+(arts.length?`<div class="grid">${[...arts].sort((a,b)=>b.t-a.t).map(artCard).join('')}</div>`:artEmpty())}
function tasksPage(){const f=S.tf||'all',C={all:0,today:0,up:0,done:0};D.tasks.forEach(t=>{const c=tcls(t);for(const k in C)if(c[k])C[k]++});const list=[...D.tasks].filter(t=>tcls(t)[f]).sort((a,b)=>(b.pri==2)-(a.pri==2)||(a.due||'9').localeCompare(b.due||'9'));const nc=noteChecks().filter(x=>f=='all'?!x.done:f=='done'?x.done:false);
const groups={};nc.forEach(x=>(groups[x.nid]=groups[x.nid]||[]).push(x));
return hdr('Tasks')+hint('tasks','tasks','Tasks and reminders','Tick a task to complete it, tap the star for high priority, tap a task to edit its date, time and reminder. The + button adds a new one.')+`<div class="pills">${[['all','All'],['today','Today'],['up','Upcoming'],['done','Done']].map(([k,l])=>`<button class="chip ${f==k?'on':''}" data-a="tf" data-v="${k}">${l} (${C[k]})</button>`).join('')}</div>${list.length?`<div class="bx" style="padding:4px 14px">${list.map(trow).join('')}</div>`:empty('tasks',f=='done'?'Nothing completed yet':'No tasks here','Tap the + button to add a task. Tasks can also come from TODO: lines in a note.')}${Object.keys(groups).length?`<div class="sec"><b>Checklists in your notes</b></div><div class="dim" style="margin:-4px 2px 10px;font-family:inherit">Tick items here and they update inside the note.</div>`+Object.keys(groups).slice(0,6).map(id=>{const n=get(id);return `<div class="bx" style="padding:10px 14px;margin-bottom:10px"><button class="mrow" data-a="open" data-v="${id}" style="padding:2px 0 8px;border:0">${ic('notes',18)}<b style="flex:1">${E(n.title||'Untitled')}</b>${ic('chev',14)}</button>${groups[id].slice(0,5).map(x=>`<div class="tr" style="padding:8px 0"><button class="rc ${x.done?'on':''}" data-a="nck" data-v="${id}:${x.line}" aria-label="Tick item" title="Tick item">${x.done?ic('check',14):''}</button><div class="m"><b style="font-weight:600;${x.done?'text-decoration:line-through;opacity:.5':''}">${E(x.text)}</b></div></div>`).join('')}${groups[id].length>5?`<div class="dim">+${groups[id].length-5} more in this note</div>`:''}</div>`}).join(''):''}`}
function home(live,arts,open){const td=dkey(Date.now()),doneN=D.tasks.filter(t=>t.done).length,tot=D.tasks.length,pct=tot?Math.round(doneN/tot*100):0,wk=weekData(),wm=Math.max(1,...wk.map(x=>x.c)),stk=streak(),wT=live.filter(n=>dkey(n.t)==td).reduce((a,n)=>a+wc(n.body),0),goal=D.set.goal||300,gp=Math.min(100,Math.round(wT/goal*100)),cur=wk.reduce((a,x)=>a+x.c,0),prev=weekPrev(),chg=prev?Math.round((cur-prev)/prev*100):null;
const dueT=open.filter(t=>t.due&&t.due<=td).length,next=[...open].sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,3),nck=noteChecks().filter(x=>!x.done).slice(0,Math.max(0,3-next.length));
const rec=[...live].sort((a,b)=>b.pin-a.pin||b.t-a.t).slice(0,4),tg=[...new Set(live.flatMap(n=>tagsOf(n.body)))].slice(0,10),hd=S.hday,dn=hd!=null?wk[hd]:null;
const initial=(nm_()[0]||'E').toUpperCase();
return `<div class="hd"><div class="hl2"><div class="gr2">Hello, ${E(nm_())}!</div><div class="sub2">Stay focused. You've got this!</div></div><div class="hr"><button class="avt" data-a="settings" aria-label="Profile and settings" title="Profile and settings">${D.set.ui=='pixel'?catFace(2):initial}</button></div></div>
<div class="bx sbar">${ic('search',18)}<input id="cmd" placeholder="Search anything, or type /command" autocapitalize="none" autocomplete="off" aria-label="Search or command"></div><div id="sg"></div>${S.msg?`<div class="msg">${E(S.msg)}</div>`:''}
<div style="height:14px"></div>${startCard()}
<div class="qa">${[['newNote','pencil','New Note'],['newCheck','tasks','Checklist'],['newSketch','pencil','Sketch'],['cam2','camera','Photo']].map(([k,i,l])=>`<button class="btn tile" data-a="tool" data-v="${k}">${ic(i,24)}<span>${l}</span></button>`).join('')}</div>
${window.xHome?xHome():""}${window.xSaved?xSaved():""}<div class="sec"><b>Today</b><button data-a="tab" data-v="tasks">See all</button></div>
<button class="bx cardrow" data-a="tab" data-v="tasks"><div class="m"><b>Tasks</b><span class="x">${tot?'Completed: '+doneN+' of '+tot:'No tasks yet. Tap to add one'}${dueT?' • '+dueT+' due':''}</span></div>${ring(pct)}</button>
<button class="bx cardrow" data-a="goal_edit" style="display:block"><div style="display:flex;align-items:center;gap:10px"><div class="m"><b>Daily Goal</b><span class="x">${wT} / ${goal} words today</span></div>${ic('chev',18)}</div><div class="bar2"><i style="width:${gp}%"></i></div></button>
<div class="bx" style="padding:4px 14px">${next.map(t=>`<div class="tr"><button class="rc" data-a="tdone" data-v="${t.id}" aria-label="Mark done" title="Mark done"></button><div class="m" data-a="t_edit" data-v="${t.id}"><b>${E(t.text)}</b><span class="x">${taskSub(t)}${t.rem?' • Reminder':''}</span></div>${ic('chev',14)}</div>`).join('')}${nck.map(x=>`<div class="tr"><button class="rc" data-a="nck" data-v="${x.nid}:${x.line}" aria-label="Tick item" title="Tick item"></button><div class="m" data-a="open" data-v="${x.nid}"><b>${E(x.text)}</b><span class="x">From “${E((get(x.nid).title||'Untitled').replace(/^(.{0,22})(\s.*)?$/,'$1').trimEnd().replace(/\s+(and|or|the|a|to|of|in)$/i,''))}”</span></div>${ic('chev',14)}</div>`).join('')||''}${next.length||nck.length?'':'<div class="dim" style="padding:14px 0;font-family:inherit">Nothing pending. Add tasks in the Tasks tab, or write a TODO: line in any note.</div>'}</div>
<div class="sec"><b>Insights</b></div>
<div class="bx cardrow" style="display:block;cursor:default"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:16px">This Week</b><span class="chg" style="color:${chg==null?'var(--dim)':chg>=0?'#1F9D55':'#E5484D'}">${chg==null?'—':(chg>=0?'+':'')+chg+'%'}</span></div><div class="bars">${wk.map((x,i)=>`<button class="${x.today?'t':''} ${hd==i?'sel2':''}" data-a="home_day" data-v="${i}" title="${x.full}: ${x.c} note(s)" aria-label="${x.full}: ${x.c} notes"><i style="height:${Math.max(8,x.c/wm*100)}%"></i><span>${x.d}</span></button>`).join('')}</div>${dn?`<div class="dim" style="margin-top:12px;font-family:inherit"><b>${dn.full}</b>: ${dn.c} note${dn.c==1?'':'s'}${dn.notes.length?'<div style="margin-top:6px">'+dn.notes.slice(0,3).map(n=>`<button class="chip" data-a="open" data-v="${n.id}" style="margin:2px 4px 2px 0">${E((n.title||'Untitled').slice(0,22))}</button>`).join('')+'</div>':''}</div>`:'<div class="dim" style="margin-top:10px;font-family:inherit">Tap a day to see its notes.</div>'}</div>
<div class="cg"><button class="bx cc" data-a="home_streak"><span style="color:var(--ac)">${ic('flame',22)}</span><b>${stk} day${stk==1?'':'s'}</b><span>Writing streak</span></button><button class="bx cc" data-a="tab" data-v="notes"><span style="color:var(--ac)">${ic('notes',22)}</span><b>${live.length} notes</b><span>${arts.length} article${arts.length==1?'':'s'}</span></button></div>
<div class="sec"><b>Jump back in</b><button data-a="tab" data-v="notes">See all</button></div>${rec.length?`<div class="bx" style="padding:4px 14px">${rec.map(nrow).join('')}</div>`:empty('pencil','No notes yet','Tap New Note above to write your first one.')}
<div class="sec"><b>Explore</b></div><div class="hs2">${D.set.ws.map(w=>{const c=live.filter(n=>n.fo==w).length;return`<button class="bx cc" data-a="wsgo" data-v="${E(w)}" style="min-width:130px">${ic('folder',22)}<b>${E(w)}</b><span>${c} notes</span></button>`}).join('')}</div>${tg.length?`<div class="pills" style="margin-top:6px;flex-wrap:wrap">${tg.map(t=>`<button class="chip" data-a="tagg" data-v="${t}">#${t}</button>`).join('')}</div>`:''}`}
function weekPrev(){let c=0;for(let i=13;i>=7;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);c+=D.notes.filter(n=>!n.del&&(dkey(n.t)==k||dkey(n.cr||n.t)==k)).length}return c}

const tgl=(on,a,v)=>`<button class="tg ${on?'on':''}" data-a="${a}" data-v="${v||''}" role="switch" aria-checked="${!!on}" aria-label="Toggle"></button>`;
const srow=(i,t,sub,a,v,b)=>`<button class="srow" data-a="${a}" data-v="${v||''}"><span class="sic">${ic(i,20)}</span><span class="stx"><b>${t}</b><small>${sub}</small></span>${b?`<span class="bdg">${b}</span>`:''}${ic('chev',16)}</button>`;

function uiThumb(k){const dk=document.documentElement.dataset.mode=='dark',v=UIS[k].mk(dk),st=Object.keys(v).map(x=>`--${x}:${v[x]}`).join(';');return `<button class="uit ${(D.set.ui||'clean')==k?'on':''}" data-a="ui" data-v="${k}" aria-label="${UIS[k].n}"><div class="uip" style="${st};background:var(--body);font-family:var(--font)"><div class="uib" style="background:var(--card);border:var(--bw) solid var(--bc);box-shadow:var(--sh);border-radius:var(--r)"><i style="background:var(--tx)"></i><i style="background:var(--dim);width:55%"></i></div><div class="uib2"><span style="background:var(--ac);border-radius:var(--cr)"></span><span style="background:var(--ctl);border:var(--bw) solid var(--bc);border-radius:var(--cr)"></span></div></div>${UIS[k].n}</button>`}
function settingsPage(){const sp=S.sp||'',T={profile:'My Profile',appearance:'Appearance',designs:'Article designs',organise:'Writing and organising',notif:'Notifications',privacy:'Privacy and Security',backup:'Backup and Sync',help:'Help and tips',about:'About'};
let h=`<div class="hd"><div class="hl2" style="display:flex;align-items:center;gap:6px"><button class="ib" data-a="${sp?'sp_back':'settings_close'}" aria-label="Back" title="Back">${ic('back',22)}</button><div class="ttl" style="font-size:24px">${sp?T[sp]:'Settings'}</div></div></div>`;
const note=t=>`<div class="dim" style="margin:0 2px 10px;font-family:inherit;line-height:1.45">${t}</div>`;
if(!sp)h+=`<div class="bx grp">${srow('user','My Profile','Name and daily goal','sp','profile')}${srow('eye','Appearance','Themes, UI style, text size','sp','appearance')}${srow('news','Article designs','Templates for your articles','sp','designs')}${srow('folder','Writing and organising','Workspaces, note templates','sp','organise')}${srow('bell','Notifications','Reminders and alerts','sp','notif')}${srow('shield','Privacy and Security','Your data and controls','sp','privacy')}${srow('cloud','Backup and Sync','Keep your notes safe','sp','backup')}${srow('help','Help and tips','Tour, tips, sample notes','sp','help')}${srow('info','About','Version and credits','sp','about')}</div>`;
else if(sp=='profile')h+=`<div class="lab">Your name</div><input class="in" id="pf_name" placeholder="Explorer" value="${E(D.set.name||'')}" aria-label="Your name"><div class="dim" style="margin-top:6px;font-family:inherit">Shown in the greeting on Home.</div><div class="lab">Daily writing goal</div><div class="stp"><button class="chip" data-a="goal_step" data-v="-50" aria-label="Lower goal">−50</button><b>${D.set.goal||300}</b><button class="chip" data-a="goal_step" data-v="50" aria-label="Raise goal">+50</button><span class="dim" style="font-family:inherit">words per day</span></div>`;
else if(sp=='appearance')h+=note('These settings change the app itself. Your article designs are separate and are chosen per article.')+`<div class="lab">App style</div><div class="uig">${Object.keys(UIS).map(uiThumb).join('')}</div><div class="lab">Mode</div><div class="pills" style="padding:0">${[['system','Auto'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="chip ${D.set.theme==k?'on':''}" data-a="th" data-v="${k}">${l}</button>`).join('')}</div><div class="lab">Accent color</div><div class="opt">${ACS.map(x=>`<button class="sw ${D.set.ac==x?'on':''}" style="background:${x}" data-a="ac" data-v="${x}" aria-label="Accent ${x}"></button>`).join('')}</div><div class="lab">Text size</div><div class="stp"><button class="chip" data-a="fs" data-v="-1" aria-label="Smaller text">A−</button><b>${D.set.fs||16}px</b><button class="chip" data-a="fs" data-v="1" aria-label="Larger text">A+</button></div>`;
else if(sp=='designs')h+=note('Pick the design new articles start with. You can change any single article later from its DESIGN button.')+tplGrid(tplIdx(D.set),'tpl_def');
else if(sp=='organise')h+=`<div class="lab">Workspaces</div><div class="bx grp">${D.set.ws.map(w=>setRow(E(w),'Tap Edit to rename or delete',`<button class="chip" data-a="wsx" data-v="${E(w)}">Edit</button>`)).join('')}</div><button class="chip" data-a="addws" style="display:inline-flex;gap:6px;align-items:center">${ic('plus',14)} Add workspace</button><div class="lab">Note templates (optional)</div>${note('Start a new note from a ready-made outline.')}<div class="bx grp">${Object.keys(TPL).map(k=>setRow(k,'',`<button class="chip" data-a="tpl" data-v="${k}">Use</button>`)).join('')}</div>`;
